name: uv package publish
on:
  release:
    types: ["published"]

jobs:
  ci:
    name: "CI"
    uses: ./.github/workflows/ci.yml

  check-version:
    name: "Check tag matches project version"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare release tag with pyproject version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'EOF'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          if tag != version:
              sys.exit(f"Release tag {tag!r} does not match project version {version!r}")
          print(f"Release tag matches project version {version}")
          EOF

  publish:
    name: "Build and publish release"
    runs-on: ubuntu-latest
    needs: [ci, check-version]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish
