[project]
name = "funcy-typing"
version = "2.0.8"
description = "Stubs for funcy package"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ratschew Fedor", email = "feodor.ra@me.com" }]
keywords = ["funcy", "types", "typing", "stubs"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Typing :: Stubs Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = ["funcy~=2.0", "typing-extensions>=4.11"]

[dependency-groups]
dev = ["pre-commit==4.6.2", "pyright[nodejs]==1.1.411", "ruff==0.16.5"]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.13" }

[project.urls]
Repository = "https://github.com/feodor-ra/funcy-stubs"
Homepage = "https://github.com/feodor-ra/funcy-stubs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funcy-stubs"]

[tool.ruff]
include = ["src/funcy-stubs/**"]
line-length = 88
indent-width = 4
target-version = "py38"
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A001",   # funcy deliberately shadows builtins (all, any, map, filter, zip, ...)
    "A004",   # re-exporting those shadowed names is the point of the stubs
    "ANN401", # Any is unavoidable when typing funcy's dynamic helpers
    "COM812", # conflicts with the formatter
    "CPY001", # no per-file copyright notices in this project
    "D100",   # stub-only package, no docstrings
    "D203",   # incompatible with D211 (formatter-aligned choice)
    "D213",   # incompatible with D212 (formatter-aligned choice)
    "INP001", # src/funcy-stubs is a PEP 561 stubs dir, not an importable package
    "N801",   # class names mirror funcy runtime (cached_property, ...)
]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
preview = true

[tool.pyright]
include = ["src/funcy-stubs/"]
typeCheckingMode = "strict"
