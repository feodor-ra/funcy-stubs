[project]
name = "funcy-typing"
version = "2.1.0"
description = "Stubs for funcy package"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ratschew Fedor", email = "feodor.ra@me.com" }]
keywords = ["funcy", "types", "typing", "stubs"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Typing :: Stubs Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = ["funcy~=2.0"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pyright[nodejs]==1.1.411",
    "ruff==0.16.5",
    "ty==0.0.77",
]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.13" }

[project.urls]
Repository = "https://github.com/feodor-ra/funcy-stubs"
Homepage = "https://github.com/feodor-ra/funcy-stubs"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "funcy-stubs"

[tool.ruff]
include = ["src/funcy-stubs/**"]
line-length = 88
indent-width = 4
target-version = "py38"
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A001",   # funcy deliberately shadows builtins (all, any, map, filter, zip, ...)
    "A004",   # re-exporting those shadowed names is the point of the stubs
    "ANN401", # Any is unavoidable when typing funcy's dynamic helpers
    "COM812", # conflicts with the formatter
    "CPY001", # no per-file copyright notices in this project
    "D100",   # stub-only package, no docstrings
    "D203",   # incompatible with D211 (formatter-aligned choice)
    "D213",   # incompatible with D212 (formatter-aligned choice)
    "INP001", # src/funcy-stubs is a PEP 561 stubs dir, not an importable package
    "N801",   # class names mirror funcy runtime (cached_property, ...)
]
preview = true

[tool.ruff.lint.per-file-ignores]
# funcy.py3 is literally a star-reexport of every module — the stub mirrors that,
# and its __all__ names all come from those star imports
"src/funcy-stubs/py3.pyi" = ["F403", "F405"]
# funcy.compat exports the name Set itself, aliasing would change the API
"src/funcy-stubs/compat.pyi" = ["PYI025"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
preview = true

[tool.pyright]
include = ["src/funcy-stubs/"]
typeCheckingMode = "strict"
pythonVersion = "3.8"

[tool.mypy]
files = ["src/funcy-stubs"]
strict = true
# mypy >=2.3 only targets 3.10+; 3.8/3.9 remain covered by pyright
python_version = "3.10"

[tool.ty.environment]
python-version = "3.8"

[tool.ty.src]
include = ["src/funcy-stubs"]
